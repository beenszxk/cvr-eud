<style>
:root{--bg:#0a0a0a;--sf:#161616;--tx:#f5f5f5;--mu:#9a9a9a;--bd:#2c2c2c;--ac:#f00}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#2a0505 0,transparent 55%) no-repeat,var(--bg);min-height:100vh;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{background:radial-gradient(circle at 15% 0,rgba(255,40,40,.55),transparent 55%),linear-gradient(135deg,#050505 0%,#4a0000 50%,#e60000 100%);color:#fff;padding:22px 16px 20px;text-align:center;border-bottom:3px solid #ff3030;box-shadow:0 6px 30px rgba(255,0,0,.25)}
header img{width:170px;height:170px;object-fit:contain;display:block;margin:0 auto 6px;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 16px rgba(255,255,255,.6))}
header h1{margin:0;font-size:clamp(24px,5vw,38px);letter-spacing:.06em;font-weight:900;text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.6)}
header p{margin:4px 0 0;color:#ffd0d0;font-weight:600}
nav{backdrop-filter:blur(8px);display:flex;justify-content:center;gap:6px;padding:10px;background:rgba(22,22,22,.9);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;color:var(--mu);font:600 15px inherit;padding:9px 18px;border-radius:99px;cursor:pointer}
nav button.on{background:linear-gradient(135deg,#ff2a2a,#b30000);box-shadow:0 0 14px rgba(255,0,0,.45);color:#fff}
main{max-width:1000px;margin:0 auto;padding:18px 14px 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar h2{margin:0;flex:1;font-size:22px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
.bar input,.bar select{flex:1;min-width:130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:linear-gradient(160deg,#1e1e1e,#121212);border:1px solid var(--bd);border-radius:16px;padding:14px;overflow:hidden}
.pl{display:flex;gap:12px;align-items:center}
.av{width:62px;height:62px;border-radius:50%;flex:none;background:linear-gradient(135deg,#ff2a2a,#600);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;object-fit:cover;border:3px solid var(--bd)}
.nm{font-weight:700;font-size:16px;word-break:break-word}
.mu{color:var(--mu);font-size:13px}
a.mu{text-decoration:underline}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);margin:4px 4px 0 0}
.tm{border-top:6px solid var(--c,#f00)}
.tm h3{margin:0 0 2px}
.ro{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.ro li{display:flex;gap:8px;align-items:center;font-size:14px}
.ro .av{width:28px;height:28px;font-size:12px;border-width:2px}
.ar{display:grid;gap:10px}
.ar .card{display:flex;gap:14px;align-items:flex-start}
.yr{font-size:26px;font-weight:800;color:#ff3030;min-width:84px}
.empty{text-align:center;color:var(--mu);padding:40px 10px;border:2px dashed var(--bd);border-radius:16px}
.note{font-size:12px;color:var(--mu);text-align:center;margin-top:24px}
.note button{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:3px 10px;cursor:pointer}
.nm.cl{cursor:pointer}.nm.cl:hover{color:#ff4d4d;text-decoration:underline}
.ob{margin-left:auto;text-align:center;font-weight:900;font-size:22px;line-height:1;align-self:flex-start}
.ob small,.ovb small{display:block;font-size:9px;letter-spacing:.1em;opacity:.8}
.ovb{margin-left:auto;border:3px solid;border-radius:50%;width:72px;height:72px;display:grid;place-content:center;text-align:center;font-weight:900;font-size:26px;line-height:1;flex:none}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:30;padding:16px}.mo[hidden]{display:none}
.mb{position:relative;background:linear-gradient(160deg,#1e1e1e,#111);border:1px solid var(--bd);border-radius:18px;max-width:460px;width:100%;padding:26px 20px 20px;max-height:90vh;overflow:auto}
.x{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
.st{width:100%;border-collapse:collapse;margin-top:18px}
.st th{font-size:11px;text-align:left;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;padding:6px 8px;border-bottom:2px solid #ff3030}

function parseCSV(t){const r=[];let row=[],c="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;
  else if(ch==','){row.push(c);c=""}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=""}
  else c+=ch}
 if(c||row.length){row.push(c);r.push(row)}return r}
function objs(t){const r=parseCSV(t);if(!r.length)return[];const h=r[0].map(low);
 return r.slice(1).filter(x=>x.some(v=>v.trim())).map(x=>{const o={};h.forEach((k,i)=>o[k]=(x[i]||"").trim());return o})}
async function load(name,id=SHEET_ID){
 const r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${name}`);
 if(!r.ok)throw new Error(name);return objs(await r.text())}

 try{const[t,p,a,m,st]=await Promise.all([load("Teams"),load("Players"),load("Archive"),load("Matches",MATCHES_ID).catch(()=>[]),load("Settings").catch(()=>[])]);(st||[]).forEach(r=>{if((r.key==="discord"||r.key==="network")&&r.value)SET[r.key]=r.value});D={teams:t,players:p,archive:a,matches:(m.length&&("team1" in m[0]))?m:[]};err=""}
 catch(e){err="Could not load data. Make sure the sheet is shared as “Anyone with the link – Viewer” and the tabs are named Teams, Players and Archive."}
 render()}

 const st=rows.length?`<div class="card" style="margin-bottom:14px"><h3 style="margin:0 0 6px">Standings</h3><div class="tw"><table class="lb"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>+/−</th></tr></thead><tbody>${rows.map((x,i)=>{const t=D.teams.find(t=>low(t.name)===low(x.name));return `<tr><td>${i+1}</td><td><span class="rk" style="background:${col(t&&t.color)}"></span><b>${esc(x.name)}</b></td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td class="${x.d>0?"pos":x.d<0?"neg":"mu"}">${x.d?sgn(x.d):"0"}</td></tr>`}).join("")}</tbody></table></div></div>`:"";
 const M=[...D.matches].reverse();
 return `<div class="bar"><h2>Matches (${D.matches.length})</h2>${addB("matches")}</div>`+(M.length?`<div class="ml">${M.map(m=>{const[a,b]=mscore(m),sets=setsOf(m),mv=m.mvp?D.players.find(p=>mt(p,m.mvp)):null;
  return `<div class="card mc"><div class="mh3"><div class="mu">${esc([m.date,m.draft].filter(Boolean).join(" · "))}</div>${m.id?admB("matches",m.id):(isAdm()?`<span class="mu">no id yet: open the sheet once</span>`:"")}</div><div class="msr"><div class="mtm ${a>b?"win":""}">${esc(m.team1)}</div><div class="sc">${isNaN(a)?"–":a} – ${isNaN(b)?"–":b}</div><div class="mtm ${b>a?"win":""}">${esc(m.team2)}</div></div>${sets.length?`<div class="sets">${sets.map((x,i)=>`<span class="st2"><i>Set ${i+1}</i>${esc(x)}</span>`).join("")}</div>`:""}${m.mvp?`<div class="mvp">⭐ MVP: ${mv?`<span class="nm cl" data-n="${esc(mv.name)}">${esc(mv.name)}</span>`:`<b>${esc(m.mvp)}</b>`}</div>`:""}<div class="mrs"><div><div class="mu mh2">${esc(m.team1)} · on court</div>${mlist(m.roster1)}</div><div><div class="mu mh2">${esc(m.team2)} · on court</div>${mlist(m.roster2)}</div></div>${m.notes?`<div class="mu" style="margin-top:8px">${esc(m.notes)}</div>`:""}</div>`}).join("")}</div>`:`<div class="empty">No matches yet.</div>`)}
const TIERS=[["S","#ff4d4d"],["A","#ff9a3d"],["B","#ffd23f"],["C","#9be34b"],["D","#3dd6a0"],["E","#4aa8ff"],["F","#9a8cff"]];
let TL={},tSel="",tq="",tpos="";
try{TL=JSON.parse(localStorage.getItem("cvrTier")||"{}")||{}}catch(e){}
const saveTL=()=>{try{localStorage.setItem("cvrTier",JSON.stringify(TL))}catch(e){}};
const setTier=(k,t)=>{if(t)TL[low(k)]=t;else delete TL[low(k)];saveTL()};
const tchip=p=>`<div class="tc ${tSel===low(p.name)?"sel":""}" draggable="true" data-tp="${esc(low(p.name))}" title="${esc(p.name)}">${av(p)}<span>${esc(p.name)}</span></div>`;
function viewTier(){
 const by=(a,b)=>a.name.localeCompare(b.name),pos=[...new Set(D.players.map(p=>p.position).filter(Boolean))].sort();
 const rows=TIERS.map(([t,c])=>`<div class="tr" data-tz="${t}"><div class="tlab" style="background:${c}">${t}</div><div class="tcells">${D.players.filter(p=>TL[low(p.name)]===t).sort(by).map(tchip).join("")}</div></div>`).join("");
 const pool=D.players.filter(p=>!TIERS.some(([t])=>TL[low(p.name)]===t)&&(!tq||low(p.name+" "+p.roblox).includes(low(tq)))&&(!tpos||p.position===tpos)).sort(by);
 return `<div class="bar"><h2>Tier List</h2><button class="chip" data-tr>Reset</button></div><div class="mu" style="margin:-4px 0 12px">Drag players into a tier, or tap a player and then tap a tier. Only you can see your tier list, it is saved in your browser.</div><div class="tl">${rows}</div>
 <div class="bar" style="margin-top:20px"><h3 style="margin:0;flex:1">Players (${pool.length})</h3><input id="tq" placeholder="Search players…" value="${esc(tq)}">${dd("tp","All positions",pos,tpos)}</div>
 <div class="tpool" data-tz="">${pool.map(tchip).join("")||`<div class="mu" style="padding:10px">${D.players.length?"All players are placed.":"No players yet."}</div>`}</div>`}
document.addEventListener("dragstart",e=>{const d=e.target.closest&&e.target.closest("[data-tp]");if(d)e.dataTransfer.setData("text/plain","tp:"+d.dataset.tp)});
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest("[data-tz]");if(z){e.preventDefault();z.classList.add("over")}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest("[data-tz]");if(z&&!z.contains(e.relatedTarget))z.classList.remove("over")});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("[data-tz]");if(!z)return;const t=e.dataTransfer.getData("text/plain");if(!t.startsWith("tp:"))return;e.preventDefault();setTier(t.slice(3),z.dataset.tz);tSel="";render()});
document.addEventListener("input",e=>{if(e.target.id==="tq"){tq=e.target.value;render()}});
const SHEETS={players:"Players",teams:"Teams",archive:"Archive",matches:"Matches"},NAMES={players:"player",teams:"team",archive:"draft",matches:"match"},KEYCOL={players:"name",teams:"name",archive:"draft",matches:"id"};
let FM=null;
const encK=k=>encodeURIComponent(k);
const addB=k=>isAdm()?`<button class="ab" data-f="${k}:">+ Add</button>`:"";
const admB=(k,key)=>isAdm()&&key?`<span class="adm"><button class="ab g" data-f="${k}:${encK(key)}">Edit</button><button class="ab g" data-del="${k}:${encK(key)}">Delete</button></span>`:"";
const posList=v=>{const s=[...new Set(["Setter","Libero","Opposite","Middle","Outside",...D.players.map(p=>p.position).filter(Boolean),v].filter(Boolean))];return s.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")};
const teamOpts=v=>`<option value="">— none —</option>`+D.teams.map(x=>`<option ${low(x.name)===low(v)?"selected":""}>${esc(x.name)}</option>`).join("");
const popts=sel=>{const n=D.players.map(p=>p.name).sort((a,b)=>a.localeCompare(b));if(sel&&!n.some(x=>low(x)===low(sel)))n.unshift(sel);return `<option value="">— choose —</option>`+n.map(x=>`<option ${low(x)===low(sel)?"selected":""}>${esc(x)}</option>`).join("")};
const EMO=["🏆","⭐","🔥","🛡️","🎯","🧤","🎖️","💎","⚡","🌱"];
const FD={
 players:[["name","Name","text"],["roblox","Roblox username","text"],["position","Position","pos"],["team","Team","team"],["ovr","OVR (empty = average of skills)","num"],...SK.map(([k,l])=>[k,l+" (0–100)","num"]),["achievements","Achievements (comma or new line; start with an emoji to choose the icon)","area"]],
 teams:[["name","Team name","text"],["captain","Captain","text"],["color","Color","color"],["roster","Extra roster names (comma or new line)","area"]],
 archive:[["draft","Draft (e.g. Draft 1)","text"],["winner","Winner (team)","team"],["mvp","MVP","player"],["roster","Winning roster (comma or new line)","area"],["notes","Notes","text"]]};
const fld=([k,l,t],it)=>{const v=it?.[k]??"";let i;
 if(t==="area")i=`<textarea data-k="${k}" rows="3">${esc(v)}</textarea>`;
 else if(t==="num")i=`<input data-k="${k}" type="number" step="any" value="${esc(v)}">`;
 else if(t==="color")i=`<input data-k="${k}" type="color" value="${/^#[0-9a-f]{6}$/i.test(v)?v:"#ff0000"}" style="height:42px;padding:3px">`;
 else if(t==="team")i=`<select data-k="${k}">${teamOpts(v)}</select>`;
 else if(t==="player")i=`<select data-k="${k}">${popts(v)}</select>`;
 else if(t==="pos")i=`<select data-k="${k}">${posList(v)}</select>`;
 else if(t==="date")i=`<input data-k="${k}" ${!v||/^\d{4}-\d\d-\d\d$/.test(v)?'type="date"':""} value="${esc(v)}">`;
 else i=`<input data-k="${k}" value="${esc(v)}">`;
 return `<label class="fl">${esc(l)}${i}</label>`+(k==="achievements"?`<div class="emo">${EMO.map(x=>`<button type="button" class="chip" data-emo="${x}">${x}</button>`).join("")}</div>`:"")};
const rrow=(name,mmr)=>`<div class="rrow"><select class="rs">${popts(name)}</select><input class="rm" type="number" step="any" placeholder="MMR ±" value="${mmr==null?"":mmr}"><button type="button" class="ab g" data-rx>✕</button></div>`;
const rbuilder=(n,it)=>`<div class="fl">Team ${n} on court (players and MMR ±)</div><div class="rb" data-side="${n}">${parseRoster(it?.["roster"+n]).map(r=>rrow(r.name,r.mmr)).join("")}</div><div><button type="button" class="ab g" data-ra="${n}">+ Add player</button></div>`;
const matchFields=it=>{const st=setsOf(it||{});
 return fld(["date","Date","date"],it)+fld(["draft","Draft / label","text"],it)+`<div class="f2">${fld(["team1","Team 1","team"],it)}${fld(["team2","Team 2","team"],it)}</div>`+
 `<div class="fl">Set scores (e.g. 25-20)</div><div class="f5">${[1,2,3,4,5].map(i=>`<input data-k="set${i}" placeholder="Set ${i}" value="${esc(st[i-1]||"")}">`).join("")}</div>`+
 `<div class="f2">${fld(["score1","Sets won, team 1 (empty = auto)","num"],it)}${fld(["score2","Sets won, team 2 (empty = auto)","num"],it)}</div>`+
 fld(["mvp","MVP","player"],it)+rbuilder(1,it)+rbuilder(2,it)+fld(["notes","Notes","text"],it)};
function openForm(kind,key){
 if(kind==="links"){FM={kind,key:""};$("fm").innerHTML=`<div class="mb"><button class="x" data-xf>✕</button><h3 style="margin:0 0 12px">Edit links</h3><div class="fg">${fld(["discord","Discord invite link","text"],SET)}${fld(["network","Website link (Network)","text"],SET)}</div><div class="fa"><span id="fs"></span><button class="ab g" data-xf>Cancel</button><button class="ab" id="fsave">Save</button></div></div>`;$("fm").hidden=false;return}
 FM={kind,key};const it=key?D[kind].find(x=>String(x[KEYCOL[kind]])===key):null;
 $("fm").innerHTML=`<div class="mb ${kind==="matches"?"wide":""}"><button class="x" data-xf>✕</button><h3 style="margin:0 0 12px">${key?"Edit":"Add"} ${NAMES[kind]}</h3><div class="fg">${kind==="matches"?matchFields(it):FD[kind].map(f=>fld(f,it)).join("")}</div><div class="fa"><span id="fs"></span><button class="ab g" data-xf>Cancel</button><button class="ab" id="fsave">Save</button></div></div>`;
 $("fm").hidden=false}
const fmsg=(t,bad)=>{const e=$("fs");if(e){e.textContent=t;e.style.color=bad?"#ff6b6b":"#6bdc8b"}};
function formData(){const d={};$("fm").querySelectorAll("[data-k]").forEach(e=>d[e.dataset.k]=e.value.trim());
 if(FM.kind==="matches")[1,2].forEach(n=>{d["roster"+n]=[...$("fm").querySelectorAll(`.rb[data-side="${n}"] .rrow`)].map(r=>{const nm=r.querySelector(".rs").value,m=r.querySelector(".rm").value.trim();return nm?(m!==""?`${nm} ${(+m>=0?"+":"")+m}`:nm):""}).filter(Boolean).join(", ")});
 return d}
function applyLocal(kind,key,d,j){const kc=KEYCOL[kind],A=D[kind],i=key?A.findIndex(x=>String(x[kc])===key):-1;
 const row=Object.assign({},i>=0?A[i]:{},d);if(kind==="matches"&&!row.id)row.id=(j&&j.id)||"";
 if(i>=0)A[i]=row;else A.push(row);
 if(kind==="teams"&&key&&low(key)!==low(d.name)){D.players.forEach(p=>{if(low(p.team)===low(key))p.team=d.name});D.matches.forEach(m=>{if(low(m.team1)===low(key))m.team1=d.name;if(low(m.team2)===low(key))m.team2=d.name});D.archive.forEach(a=>{if(low(a.winner)===low(key))a.winner=d.name})}}
async function post(body){try{const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(Object.assign({key:KEY()},body))});return await r.json()}catch(e){try{await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(Object.assign({key:KEY()},body))});return{ok:true,unsure:true}}catch(_){return{ok:false,error:"Could not reach the server"}}}}
async function saveForm(){const{kind,key}=FM,d=formData(),kc=KEYCOL[kind];
 if(kind==="links"){const fix=u=>/^https?:\/\//i.test(u)?u:(u?"https://"+u:"");const b=$("fsave");b.disabled=true;fmsg("Saving…");
  for(const k of ["discord","network"]){const v=fix(d[k]),j=await post({action:"upsert",sheet:"Settings",keyCol:"key",keyVal:k,mode:"set",data:{key:k,value:v}});
   if(!j.ok){b.disabled=false;fmsg("Error: "+(j.error||"not saved"),1);if(j.error==="bad password"){try{localStorage.removeItem("cvrKey")}catch(e){}}return}
   if(v)SET[k]=v}
  b.disabled=false;$("fm").hidden=true;render();return}
 if(kind==="matches"){if(!d.team1||!d.team2||low(d.team1)===low(d.team2))return fmsg("Choose two different teams",1)}
 else if(!d[kc])return fmsg("Please fill in: "+kc,1);
 const b=$("fsave");b.disabled=true;fmsg("Saving…");
 const j=await post({action:"upsert",sheet:SHEETS[kind],keyCol:kc,keyVal:key||"",mode:key?"edit":"add",data:d});
 b.disabled=false;
 if(!j.ok){fmsg("Error: "+(j.error||"not saved"),1);if(j.error==="bad password"){try{localStorage.removeItem("cvrKey")}catch(e){}}return}
 applyLocal(kind,key,d,j);$("fm").hidden=true;$("md").hidden=true;render()}
async function delRow(kind,key){if(!confirm("Delete this "+NAMES[kind]+"? This removes it from the Google Sheet."))return;
 const kc=KEYCOL[kind],j=await post({action:"delete",sheet:SHEETS[kind],keyCol:kc,keyVal:key});
 if(!j.ok){alert("Error: "+(j.error||"not deleted"));if(j.error==="bad password"){try{localStorage.removeItem("cvrKey")}catch(e){}}return}
 D[kind]=D[kind].filter(x=>String(x[kc])!==key);
 if(kind==="teams")D.players.forEach(p=>{if(low(p.team)===low(key))p.team=""});
 $("md").hidden=true;render()}
document.addEventListener("click",e=>{
 const fe=e.target.closest("[data-f]");if(fe){const s=fe.dataset.f,i=s.indexOf(":");openForm(s.slice(0,i),decodeURIComponent(s.slice(i+1)));return}
 const de=e.target.closest("[data-del]");if(de){const s=de.dataset.del,i=s.indexOf(":");delRow(s.slice(0,i),decodeURIComponent(s.slice(i+1)));return}
 if(e.target.closest("[data-xf]")||e.target.id==="fm"){$("fm").hidden=true;return}
 if(e.target.id==="fsave"){saveForm();return}
 const ra=e.target.closest("[data-ra]");if(ra){$("fm").querySelector(`.rb[data-side="${ra.dataset.ra}"]`).insertAdjacentHTML("beforeend",rrow("",null));return}
 const rx=e.target.closest("[data-rx]");if(rx){rx.closest(".rrow").remove();return}
 const em=e.target.closest("[data-emo]");if(em){const ta=$("fm").querySelector('[data-k="achievements"]');if(ta){ta.value+=(ta.value.trim()&&!/[\n,;]\s*$/.test(ta.value)?", ":"")+em.dataset.emo+" ";ta.focus()}return}
});
function render(){
 $("nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" data-t="${k}">${l}</button>`).join("");
 const f=document.activeElement?.id;
 $("app").innerHTML=err?`<div class="empty">${esc(err)}</div>`:({teams:viewTeams,players:viewPlayers,leaderboard:viewLb,tier:viewTier,matches:viewMatches,archive:viewArchive,info:viewInfo})[tab]()+`<div class="note"><button id="rf">↻ Refresh</button>${apiOn()?` <button id="ad">${KEY()?"Admin: on":"Admin login"}</button>`:""}</div>`;
 if(f==="q"){const e=$("q");e.focus();e.setSelectionRange(q.length,q.length)}if(f==="tq"){const e=$("tq");e.focus();e.setSelectionRange(tq.length,tq.length)}}
document.addEventListener("click",e=>{const n=e.target.closest("[data-n]");if(n){openP(n.dataset.n);return}if(e.target.id==="md"||e.target.closest("[data-x]")){$("md").hidden=true;return}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("fm").hidden)$("fm").hidden=true;else $("md").hidden=true}});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.t){tab=b.dataset.t;location.hash=tab;render()}else if(b.id==="rf")boot()});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;render()}if(e.target.id==="fp"){fp=e.target.value;render()}});
const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))tab=h;
render();boot();
</script>
</body>
</html>
